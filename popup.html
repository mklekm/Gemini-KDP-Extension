<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Gemini KDP Ultimate Studio</title>
  <style>
    /* BASE DESIGN SYSTEM (Inter Font + Modern Gradient) */
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #a855f7;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius: 8px;
    }

    body {
      width: 400px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      font-size: 13px;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      padding: 24px 20px 30px;
      color: white;
      text-align: center;
      clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 4px 0 0;
      font-size: 11px;
      opacity: 0.9;
      font-weight: 500;
    }

    /* TABS */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: -24px;
      padding: 0 15px;
      position: relative;
      z-index: 10;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
      color: var(--primary);
    }

    .tab-btn.active {
      background: var(--text-main);
      color: white;
      border-color: var(--text-main);
      box-shadow: var(--shadow-md);
    }

    /* CONTAINERS */
    .container {
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .hidden {
      display: none !important;
    }

    /* FORM ELEMENTS */
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      color: var(--text-main);
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    /* LIBRARY GRID */
    .lib-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .lib-item {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.2s;
      position: relative;
    }

    .lib-item:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-light);
    }

    .lib-thumb {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background: #e2e8f0;
    }

    .lib-info {
      padding: 10px;
    }

    .lib-title {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lib-date {
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* PROJECT DETAIL */
    .page-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      background: #f8fafc;
      padding: 10px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .page-thumb {
      width: 60px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #e2e8f0;
    }

    .page-meta {
      flex: 1;
      min-width: 0;
    }

    .page-text {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .action-row {
      display: flex;
      gap: 6px;
    }

    .btn-mini {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-dl {
      background: #e2e8f0;
      color: #475569;
    }

    .btn-dl:hover {
      background: #cbd5e1;
    }

    .btn-fix {
      background: #dbeafe;
      color: #2563eb;
    }

    .btn-fix:hover {
      background: #bfdbfe;
    }

    /* FOOTER & BUTTONS */
    .footer {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-main {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      font-weight: 700;
      cursor: pointer;
      color: white;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    .btn-main:hover {
      opacity: 0.9;
    }

    .btn-start {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-stop {
      background: #ef4444;
      flex: 0.4;
    }

    .btn-icon {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      padding: 0 12px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: #e2e8f0;
    }

    /* ALERTS */
    .alert-resume {
      background: #fefce8;
      border: 1px solid #fde047;
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 16px;
      animation: slideDown 0.3s ease;
    }

    .alert-title {
      color: #854d0e;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .resume-actions {
      display: flex;
      gap: 8px;
    }

    .btn-res {
      flex: 1;
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-res-go {
      background: #facc15;
      color: #713f12;
    }

    .btn-res-no {
      background: transparent;
      border: 1px solid #facc15;
      color: #713f12;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Gemini KDP Studio</h1>
    <p>Pro Automation Suite • V15</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="tab-create">Source</button>
    <button class="tab-btn" data-tab="tab-settings">Settings</button>
    <button class="tab-btn" data-tab="tab-library">Library</button>
  </div>

  <div class="container">

    <!-- RESUME ALERT -->
    <div id="resume-alert" class="alert-resume hidden">
      <div class="alert-title">⚠️ Job Paused</div>
      <div class="resume-actions">
        <button id="btn-resume" class="btn-res btn-res-go">RESUME JOB</button>
        <button id="btn-discard" class="btn-res btn-res-no">DISCARD</button>
      </div>
    </div>

    <!-- CREATE TAB -->
    <div id="tab-create" class="tab-content">
      <div class="card">
        <label>Amazon Book URL</label>
        <div style="display:flex; gap:8px; margin-bottom:12px;">
          <input type="text" id="amazon-url" placeholder="https://amazon.com/dp/..." style="margin-bottom:0;">
          <button id="btn-scrape" class="btn-icon" title="Scrape Details">🔍</button>
        </div>

        <label>Book Title</label>
        <input type="text" id="book-title" placeholder="Enter Title">

        <label>Author / Style Ref</label>
        <input type="text" id="book-author" placeholder="e.g. Disney Pixar, Watercolor...">

        <label>Concept / Plot</label>
        <textarea id="story-plot" rows="4" placeholder="Briefly describe the story or theme..."></textarea>
      </div>

      <div class="footer">
        <button id="btn-start" class="btn-main btn-start">START AUTOMATION</button>
        <button id="btn-stop" class="btn-main btn-stop">STOP</button>
      </div>
      <div id="status-text" style="text-align:center; font-size:11px; margin-top:10px; color:var(--text-sub);">System
        Ready</div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-content hidden">
      <div class="card">
        <label>Output Configuration</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
          <div>
            <span style="font-size:11px; color:#64748b; display:block; margin-bottom:4px;">Page Count</span>
            <input type="number" id="page-count" value="10" min="5" max="50">
          </div>
          <div>
            <span style="font-size:11px; color:#64748b; display:block; margin-bottom:4px;">Size</span>
            <select id="book-size">
              <option value="8.5x11">8.5" x 11"</option>
              <option value="6x9">6" x 9"</option>
              <option value="8.25x6">8.25" x 6"</option>
              <option value="8.5x8.5">8.5" x 8.5"</option>
            </select>
          </div>
        </div>

        <label>Art Direction</label>
        <select id="art-style">
          <option value="Disney Pixar 3D" selected>Pixar / Disney 3D</option>
          <option value="Watercolor">Watercolor Illustration</option>
          <option value="Line Art">Coloring Book (B&W)</option>
          <option value="Anime">Anime / Manga</option>
          <option value="Realistic">Photorealistic</option>
          <option value="Cyberpunk">Cyberpunk / Sci-Fi</option>
        </select>

        <div style="margin-top:12px; display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="gen-cover" checked style="width:auto; margin:0;">
          <span style="font-size:12px;">Generate Cover Image?</span>
        </div>
      </div>
    </div>

    <!-- LIBRARY TAB -->
    <div id="tab-library" class="tab-content hidden">
      <!-- Grid View -->
      <div id="lib-grid-view">
        <div class="lib-grid" id="library-list"></div>
        <div id="empty-lib" style="text-align:center; padding:40px 20px; color:var(--text-sub);">
          <div style="font-size:24px; margin-bottom:8px;">📚</div>
          No projects saved yet.<br>Finish a job to see it here.
        </div>
      </div>

      <!-- Detail View (Hidden) -->
      <div id="project-view" class="hidden">
        <button id="btn-back-lib"
          style="background:none; border:none; color:var(--primary); font-weight:700; cursor:pointer; padding:0; margin-bottom:12px; font-size:12px;">&larr;
          Back to Library</button>
        <div
          style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:16px;">
          <h2 id="proj-title" style="margin:0; font-size:16px;">Project Title</h2>
          <button id="btn-export-pdf" class="btn-mini"
            style="background:#ef4444; color:white; border:none; padding:6px 12px; font-size:11px;">📄 Export
            PDF</button>
        </div>
        <div id="proj-pages"></div>
      </div>
    </div>

  </div>
  <script src="libs/jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>

</html>
